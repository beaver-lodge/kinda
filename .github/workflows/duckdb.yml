name: DuckDB native CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: duckdb-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            quality: true
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.3"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Restore dependencies and DuckDB runtime
        uses: actions/cache@v4
        with:
          path: |
            packages/kinda_duckdb/deps
            packages/kinda_duckdb/.runtime/downloads
          key: ${{ runner.os }}-${{ runner.arch }}-kinda-duckdb-${{ hashFiles('packages/kinda_duckdb/mix.exs', 'packages/kinda_duckdb/scripts/fetch_runtime.exs') }}
      - name: Install dependencies
        working-directory: packages/kinda_duckdb
        run: mix deps.get
      - name: Check formatting
        if: matrix.quality
        working-directory: packages/kinda_duckdb
        run: mix format --check-formatted
      - name: Reject compiler warnings
        working-directory: packages/kinda_duckdb
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        if: matrix.quality
        working-directory: packages/kinda_duckdb
        run: mix credo --strict
      - name: Run DuckDB C API tests
        working-directory: packages/kinda_duckdb
        run: mix test --force
