name: Publish to Hex.pm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: hex-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.3"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Reject compiler warnings
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        run: mix credo --strict --ignore-checks TagTODO,AliasUsage,PredicateFunctionNames,ModuleDoc,WithSingleClause,PreferImplicitTry,AliasOrder,ParenthesesOnZeroArityDefs,Nesting,CyclomaticComplexity,Apply
      - name: Run tests
        run: mix test --force --warnings-as-errors

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.3"
      - run: mix local.hex --force
      - name: Align version
        run: |
          sed -i.bak 's/-dev//g' mix.exs && rm -f mix.exs.bak
      - name: Verify tag/version alignment
        run: |
          set -euo pipefail
          VERSION="$(
            elixir -e 'source = File.read!("mix.exs"); [v] = Regex.run(~r/version: "([^"]+)"/, source, capture: :all_but_first); IO.puts(v)'
          )"
          test "${{ github.ref_name }}" = "v$VERSION"
      - name: Install dependencies
        run: mix deps.get
      - name: Check whether release already exists
        id: idempotency
        run: |
          VERSION="$(
            elixir -e 'source = File.read!("mix.exs"); [v] = Regex.run(~r/version: "([^"]+)"/, source, capture: :all_but_first); IO.puts(v)'
          )"
          if curl -fsS "https://hex.pm/api/packages/kinda/releases/$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Hex.pm
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
