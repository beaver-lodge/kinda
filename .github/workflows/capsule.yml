name: Capsule CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: capsule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: otp27-ex1.20 / ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            quality: true
          - runs-on: macos-15
            quality: false
          - runs-on: windows-2025
            quality: false

    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.3"
      - name: Check test policy
        if: matrix.quality
        working-directory: packages/kinda_capsule
        run: elixir ../../scripts/check_test_policy.exs test
      - name: Install dependencies
        working-directory: packages/kinda_capsule
        run: mix deps.get
      - name: Check formatting
        if: matrix.quality
        working-directory: packages/kinda_capsule
        run: mix format --check-formatted
      - name: Reject compiler warnings
        working-directory: packages/kinda_capsule
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        if: matrix.quality
        working-directory: packages/kinda_capsule
        run: mix credo --strict
      - name: Run lifecycle suite repeatedly
        working-directory: packages/kinda_capsule
        run: mix test --repeat-until-failure 5 --max-failures 1
