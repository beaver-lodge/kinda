name: Elixir CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manx-build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  KINDA_PRINT_LINKAGES: 1

jobs:
  build:
    name: otp${{matrix.otp}}-ex${{matrix.elixir}} / ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: "ubuntu-22.04"
            otp: "24.2"
            elixir: "1.14.0"
            quality: false
          - runs-on: "ubuntu-22.04"
            otp: "27.3"
            elixir: "1.20.3"
            quality: true
          - runs-on: "macos-15"
            otp: "27.3"
            elixir: "1.20.3"
            quality: false
          - runs-on: "windows-2022"
            otp: "27.3"
            elixir: "1.20.3"
            quality: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-kinda-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-kinda-
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: ./packages/kinda_example/deps
          key: ${{ runner.os }}-mix-example-${{ hashFiles('**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-example-
      - name: Restore Kinda SQLite dependencies cache
        uses: actions/cache@v4
        with:
          path: ./packages/kinda_sqlite/deps
          key: ${{ runner.os }}-mix-kinda-sqlite-${{ hashFiles('**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-kinda-sqlite-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting of Elixir
        if: matrix.quality
        run: mix format --check-formatted
      - name: Reject compiler warnings
        if: matrix.quality
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        if: matrix.quality
        run: mix credo --strict --ignore-checks TagTODO,AliasUsage,PredicateFunctionNames,ModuleDoc,WithSingleClause,PreferImplicitTry,AliasOrder,ParenthesesOnZeroArityDefs,Nesting,CyclomaticComplexity,Apply
      - name: Run root verifier
        env:
          MIX_ENV: test
        run: |
          mix kinda.verify
      - name: Install dependencies (example)
        working-directory: ./packages/kinda_example
        run: mix deps.get
      - name: Reject compiler warnings (example)
        if: matrix.quality
        working-directory: ./packages/kinda_example
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Check formatting of Elixir
        if: matrix.quality
        working-directory: ./packages/kinda_example
        run: mix format --check-formatted
      - name: Run Credo (example)
        if: matrix.elixir == '1.20.3'
        working-directory: ./packages/kinda_example
        run: mix credo --strict
      - name: Check formatting of Zig
        if: matrix.quality
        run: |
          zig fmt --check src
          zig fmt --check packages/kinda_example/native/zig-src
          zig fmt --check packages/kinda_sqlite/build.zig
          zig fmt --check packages/kinda_sqlite/native/zig-src
      - name: Install dependencies (Kinda SQLite)
        working-directory: ./packages/kinda_sqlite
        run: mix deps.get
      - name: Reject compiler warnings (Kinda SQLite)
        if: matrix.elixir == '1.20.3'
        working-directory: ./packages/kinda_sqlite
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Check formatting of Elixir (Kinda SQLite)
        if: matrix.elixir == '1.20.3'
        working-directory: ./packages/kinda_sqlite
        run: mix format --check-formatted
      - name: Run Credo (Kinda SQLite)
        if: matrix.elixir == '1.20.3'
        working-directory: ./packages/kinda_sqlite
        run: mix credo --strict
      - name: Install gdb
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gdb
      - name: Run tests (example with gdb and stack trace)
        if: runner.os == 'Linux'
        working-directory: ./packages/kinda_example
        run: |
          bash ../../scripts/gdb.sh test
        env:
          KINDA_DUMP_STACK_TRACE: "1"
      - name: Run tests (example with gdb)
        if: runner.os == 'Linux'
        working-directory: ./packages/kinda_example
        run: |
          bash ../../scripts/gdb.sh test
      - name: Run tests (example)
        working-directory: ./packages/kinda_example
        run: |
          mix test --force
      - name: Run tests (example with stack trace)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: ./packages/kinda_example
        run: |
          mix test --force
        env:
          KINDA_DUMP_STACK_TRACE: "1"
      - name: Precompile
        if: runner.os == 'Linux'
        working-directory: ./packages/kinda_example
        env:
          MIX_ENV: prod
          ELIXIR_MAKE_CACHE_DIR: .
        run: |
          rm -rf _build
          mix elixir_make.precompile
      - name: Precompile Kinda SQLite
        if: matrix.elixir == '1.20.3'
        working-directory: ./packages/kinda_sqlite
        env:
          MIX_ENV: prod
          ELIXIR_MAKE_CACHE_DIR: .
        run: |
          rm -rf _build
          mix elixir_make.precompile
      - name: Start mock server in the background
        if: runner.os == 'Linux'
        working-directory: ./packages/kinda_example
        run: |
          python3 -m http.server --directory . &> /dev/null &
          sleep 3
          ps aux
      - name: Test precompiled
        if: runner.os == 'Linux'
        working-directory: ./packages/kinda_example
        run: |
          MIX_ENV=prod mix elixir_make.checksum --all --ignore-unavailable --only-local --print
          mix clean
          mix test --exclude vulkan --exclude todo
